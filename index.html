<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NOVA AI - Asistente inteligente"
    >

    <title>NOVA AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================
         BARRA LATERAL
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <div class="brand-name">
                NOVA <span>AI</span>
            </div>

        </div>


        <button class="new-chat">
            <span>＋</span>
            Nuevo chat
        </button>


        <nav class="navigation">

            <button class="nav-item active">
                <span class="nav-icon">💬</span>
                Chats
            </button>

            <button class="nav-item">
                <span class="nav-icon">⌕</span>
                Buscar
            </button>

            <button class="nav-item">
                <span class="nav-icon">▣</span>
                Biblioteca
            </button>

            <button class="nav-item">
                <span class="nav-icon">⚙</span>
                Configuración
            </button>

        </nav>


        <div class="sidebar-line"></div>


        <!-- CHATS RECIENTES -->

        <div class="recent-header">

            <span>Chats recientes</span>

            <button class="add-chat">
                ＋
            </button>

        </div>


        <div class="recent-chats">

            <button class="recent-chat active">

                <span class="chat-icon">
                    ◯
                </span>

                <div>
                    <strong>Hola</strong>
                    <small>Hoy, 18:24</small>
                </div>

            </button>


            <button class="recent-chat">

                <span class="chat-icon">
                    ◯
                </span>

                <div>
                    <strong>Explicación de fracciones</strong>
                    <small>Ayer</small>
                </div>

            </button>


            <button class="recent-chat">

                <span class="chat-icon">
                    ◯
                </span>

                <div>
                    <strong>Ideas para un canal</strong>
                    <small>Ayer</small>
                </div>

            </button>


            <button class="recent-chat">

                <span class="chat-icon">
                    ◯
                </span>

                <div>
                    <strong>Proyecto de programación</strong>
                    <small>2 días</small>
                </div>

            </button>


            <button class="recent-chat">

                <span class="chat-icon">
                    ◯
                </span>

                <div>
                    <strong>Preguntas de fútbol</strong>
                    <small>3 días</small>
                </div>

            </button>

        </div>


        <!-- PERFIL -->

        <div class="profile">

            <div class="profile-avatar">
                N
            </div>

            <div class="profile-info">

                <strong>NOVA</strong>

                <span>Asistente inteligente</span>

            </div>

            <span class="profile-arrow">
                ›
            </span>

        </div>

    </aside>



    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main class="main">


        <!-- BARRA SUPERIOR -->

        <header class="topbar">

            <button class="model-selector">

                <div>

                    <strong>
                        NOVA <span>1.0</span>
                    </strong>

                    <small>
                        Modelo más avanzado
                    </small>

                </div>

                <span class="arrow">
                    ˅
                </span>

            </button>


            <div class="top-actions">

                <button
                    class="top-button"
                    title="Buscar"
                >
                    ⌕
                </button>

                <button
                    class="top-button"
                    title="Cambiar tema"
                >
                    ☼
                </button>

                <button class="top-new-chat">
                    ＋ Nuevo chat
                </button>

            </div>

        </header>



        <!-- =========================
             ZONA DEL CHAT
        ========================== -->

        <section class="chat-area">


            <!-- BIENVENIDA -->

            <div class="welcome">

                <div class="nova-symbol">
                    ✦
                </div>


                <h1>
                    ¿En qué puedo ayudarte?
                    <span>NOVA</span>
                </h1>


                <p>
                    Soy NOVA, tu asistente inteligente.
                    Preguntame lo que quieras,<br>
                    estoy acá para ayudarte.
                </p>

            </div>



            <!-- TARJETAS -->

            <div class="suggestions">


                <button
                    class="suggestion-card"
                    data-prompt="Quiero aprender algo nuevo"
                >

                    <div class="suggestion-icon purple">
                        ♧
                    </div>

                    <div class="suggestion-text">

                        <h3>
                            Aprender
                        </h3>

                        <p>
                            Explicame un tema de
                            forma sencilla.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </button>



                <button
                    class="suggestion-card"
                    data-prompt="Quiero programar algo"
                >

                    <div class="suggestion-icon blue">
                        &lt;/&gt;
                    </div>

                    <div class="suggestion-text">

                        <h3>
                            Programar
                        </h3>

                        <p>
                            Ayudame a crear o
                            entender código.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </button>



                <button
                    class="suggestion-card"
                    data-prompt="Quiero crear algo"
                >

                    <div class="suggestion-icon green">
                        ✎
                    </div>

                    <div class="suggestion-text">

                        <h3>
                            Crear
                        </h3>

                        <p>
                            Ayudame a escribir y
                            desarrollar ideas.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </button>



                <button
                    class="suggestion-card"
                    data-prompt="Quiero investigar un tema"
                >

                    <div class="suggestion-icon orange">
                        ⌕
                    </div>

                    <div class="suggestion-text">

                        <h3>
                            Investigar
                        </h3>

                        <p>
                            Analicemos un tema
                            juntos.
                        </p>

                    </div>

                    <span class="card-arrow">
                        →
                    </span>

                </button>


            </div>



            <!-- MENSAJES -->

            <div
                class="messages"
                id="messages"
            >

            </div>


        </section>



        <!-- =========================
             CAJA PARA ESCRIBIR
        ========================== -->

        <div class="composer-container">

            <div class="composer">


                <button
                    class="composer-button"
                    id="attachButton"
                    title="Adjuntar"
                >
                    ＋
                </button>


                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Preguntale algo a NOVA..."
                ></textarea>


                <div class="composer-actions">

                    <button
                        class="composer-tool"
                        id="fileButton"
                        title="Adjuntar archivo"
                    >
                        ♧
                    </button>

                    <button
                        class="composer-tool"
                        id="webButton"
                        title="Búsqueda web"
                    >
                        ◉
                    </button>

                    <button
                        class="send-button"
                        id="sendButton"
                        title="Enviar"
                    >
                        →
                    </button>

                </div>


            </div>


            <p class="disclaimer">
                NOVA puede cometer errores.
                Verificá la información importante.
            </p>

        </div>


    </main>



    <!-- =========================
         MENU DEL MODELO
    ========================== -->

    <div
        class="model-menu"
        id="modelMenu"
    >

        <button data-model="NOVA 1.0">

            <strong>✦ NOVA 1.0</strong>

            <span>
                Equilibrado y rápido
            </span>

        </button>


        <button data-model="NOVA Reasoning">

            <strong>◇ NOVA Reasoning</strong>

            <span>
                Para problemas complejos
            </span>

        </button>


        <button data-model="NOVA Fast">

            <strong>⚡ NOVA Fast</strong>

            <span>
                Respuestas rápidas
            </span>

        </button>

    </div>



    <!-- =========================
         INPUT DE ARCHIVOS
    ========================== -->

    <input
        type="file"
        id="fileInput"
        hidden
    >



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
