
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #292d35;
      font-size: 22px;
      font-weight: bold;
    }

    .logo {
      color: #ffffff;
    }

    .logo span {
      color: #6c8cff;
    }

    #chat {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .mensaje {
      max-width: 750px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .usuario {
      margin-left: auto;
      background: #252a34;
      padding: 12px 16px;
      border-radius: 14px;
      width: fit-content;
      max-width: 75%;
    }

    .ia {
      color: #d8dbe2;
    }

    .inicio {
      text-align: center;
      margin-top: 18vh;
    }

    .inicio h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .inicio p {
      color: #969ba6;
    }

    .barra {
      padding: 15px 20px 20px;
      border-top: 1px solid #292d35;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #343945;
      background: #1b1e24;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: #6c8cff;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #5878ed;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NOVA <span>AI</span></div>
  </header>

  <main id="chat">

    <div class="inicio" id="inicio">
      <h1>¿En qué puedo ayudarte?</h1>
      <p>Estoy listo para responder tus preguntas.</p>
    </div>

  </main>

  <div class="barra">
    <input
      id="input"
      type="text"
      placeholder="Escribí un mensaje..."
      onkeydown="if(event.key === 'Enter') enviar()"
    >

    <button onclick="enviar()">Enviar</button>
  </div>

  <script>
    async function enviar() {

      const input = document.getElementById("input");
      const chat = document.getElementById("chat");
      const mensaje = input.value.trim();

      if (!mensaje) return;

      document.getElementById("inicio")?.remove();

      const usuario = document.createElement("div");
      usuario.className = "mensaje usuario";
      usuario.innerText = mensaje;

      chat.appendChild(usuario);

      input.value = "";

      const cargando = document.createElement("div");
      cargando.className = "mensaje ia";
      cargando.innerText = "NOVA está pensando...";

      chat.appendChild(cargando);

      try {

        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: mensaje
          })
        });

        const data = await res.json();

        cargando.innerText = data.reply;

      } catch (error) {

        cargando.innerText = "No pude conectarme con el servidor.";

      }

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
