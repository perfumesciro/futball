<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA AI</title>

  <meta
    name="description"
    content="NOVA AI - Tu asistente inteligente"
  >

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
</head>

<body>

  <div class="app">

    <!-- =========================
         BARRA LATERAL
    ========================== -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">

        <div class="logo">

          <div class="logo-icon">
            ✦
          </div>

          <span>NOVA AI</span>

        </div>

        <button
          class="icon-btn"
          id="closeSidebar"
          aria-label="Cerrar menú"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>


      <!-- NUEVO CHAT -->

      <button
        class="new-chat"
        id="newChat"
      >
        <i class="fa-solid fa-plus"></i>

        <span>
          Nuevo chat
        </span>
      </button>


      <!-- BUSCADOR -->

      <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="text"
          id="searchChats"
          placeholder="Buscar conversaciones..."
          autocomplete="off"
        >

      </div>


      <!-- HISTORIAL -->

      <div class="history-title">
        HISTORIAL
      </div>

      <div
        class="history"
        id="history"
      ></div>


      <!-- PARTE INFERIOR -->

      <div class="sidebar-bottom">

        <button id="themeBtn">

          <i class="fa-solid fa-moon"></i>

          <span>
            Cambiar tema
          </span>

        </button>


        <button id="clearBtn">

          <i class="fa-solid fa-broom"></i>

          <span>
            Limpiar conversación
          </span>

        </button>


        <div class="profile">

          <div class="avatar">
            U
          </div>

          <div class="profile-info">

            <strong>
              Usuario
            </strong>

            <small>
              NOVA AI
            </small>

          </div>

        </div>

      </div>

    </aside>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main class="main">


      <!-- BARRA SUPERIOR -->

      <header class="topbar">

        <button
          class="icon-btn menu-btn"
          id="menuBtn"
          aria-label="Abrir menú"
        >
          <i class="fa-solid fa-bars"></i>
        </button>


        <div class="model-title">

          <div class="model-name">

            <span>
              NOVA AI
            </span>

            <i class="fa-solid fa-chevron-down"></i>

          </div>

          <span class="model-subtitle">
            Asistente inteligente
          </span>

        </div>


        <!-- ESTADO -->

        <div class="status">

          <span
            class="status-dot"
          ></span>

          <span id="statusText">
            Conectando...
          </span>

        </div>

      </header>


      <!-- =========================
           ZONA DE MENSAJES
      ========================== -->

      <section
        class="messages"
        id="messages"
      >

        <!--

          Si no hay conversaciones,
          JavaScript mostrará la pantalla
          de bienvenida.

        -->

      </section>


      <!-- =========================
           COMPOSITOR
      ========================== -->

      <div class="composer-area">

        <div class="composer">


          <!-- CAJA DE TEXTO -->

          <textarea
            id="prompt"
            rows="1"
            maxlength="20000"
            placeholder="Preguntale lo que quieras a NOVA..."
            autocomplete="off"
          ></textarea>


          <!-- BOTONES -->

          <div class="composer-bottom">


            <div class="tools">


              <!-- VOZ -->

              <button
                id="voiceBtn"
                title="Hablar con NOVA"
                aria-label="Hablar"
              >
                <i class="fa-solid fa-microphone"></i>
              </button>


              <!-- ADJUNTAR -->

              <button
                id="attachBtn"
                title="Adjuntar archivo"
                aria-label="Adjuntar archivo"
              >
                <i class="fa-solid fa-paperclip"></i>
              </button>


              <!-- INPUT OCULTO -->

              <input
                type="file"
                id="fileInput"
                hidden
                multiple
              >

            </div>


            <!-- ENVIAR -->

            <button
              class="send-btn"
              id="sendBtn"
              title="Enviar mensaje"
              aria-label="Enviar mensaje"
            >

              <i class="fa-solid fa-arrow-up"></i>

            </button>

          </div>

        </div>


        <!-- AVISO -->

        <p class="disclaimer">

          NOVA puede cometer errores.
          Verificá la información importante.

        </p>

      </div>

    </main>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>
</html>
