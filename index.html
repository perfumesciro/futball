<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">N</div>
      <div>
        <strong>NOVA</strong>
        <span>AI</span>
      </div>
    </div>

    <button class="nuevo-chat" onclick="nuevoChat()">
      <span>＋</span>
      Nuevo chat
    </button>

    <div class="menu">

      <button onclick="mostrarInicio()">
        <span>⌂</span>
        Inicio
      </button>

      <button onclick="mostrarHistorial()">
        <span>◷</span>
        Historial
      </button>

      <button onclick="mostrarHerramientas()">
        <span>✦</span>
        Herramientas
      </button>

    </div>

    <div class="historial" id="historial">

      <p class="titulo-menu">CONVERSACIONES</p>

      <div id="listaChats"></div>

    </div>

    <div class="sidebar-bottom">

      <button onclick="abrirConfiguracion()">
        ⚙ Configuración
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="mobile-logo">
        NOVA <span>AI</span>
      </div>

      <div class="estado">
        <span class="punto"></span>
        NOVA está disponible
      </div>

    </header>


    <section id="contenido" class="contenido">

      <div id="inicio" class="pantalla-inicio">

        <div class="nova-grande">
          N
        </div>

        <h1>
          ¿En qué puedo ayudarte?
        </h1>

        <p>
          Soy NOVA, tu asistente inteligente.
        </p>


        <div class="acciones">

          <button onclick="usarSugerencia('Ayudame a estudiar')">
            <span>📚</span>
            <strong>Estudiar</strong>
            <small>Aprendé paso a paso</small>
          </button>

          <button onclick="usarSugerencia('Ayudame con un proyecto')">
            <span>💡</span>
            <strong>Ideas</strong>
            <small>Creá nuevos proyectos</small>
          </button>

          <button onclick="usarSugerencia('Ayudame a programar')">
            <span>💻</span>
            <strong>Programar</strong>
            <small>Resolvé errores y código</small>
          </button>

          <button onclick="usarSugerencia('Ayudame a organizar mi día')">
            <span>📋</span>
            <strong>Organizar</strong>
            <small>Ordená tus tareas</small>
          </button>

        </div>

      </div>


      <div id="chat" class="chat"></div>


      <div id="herramientas" class="herramientas oculto">

        <h2>Herramientas de NOVA</h2>

        <p>
          Elegí una herramienta para empezar.
        </p>

        <div class="herramientas-grid">

          <button onclick="abrirHerramienta('calculadora')">
            🧮
            <strong>Calculadora</strong>
            <small>Realizá cálculos</small>
          </button>

          <button onclick="abrirHerramienta('estudio')">
            📚
            <strong>NOVA Tutor</strong>
            <small>Aprendé cualquier tema</small>
          </button>

          <button onclick="abrirHerramienta('ideas')">
            💡
            <strong>NOVA Ideas</strong>
            <small>Generá ideas</small>
          </button>

          <button onclick="abrirHerramienta('codigo')">
            💻
            <strong>NOVA Code</strong>
            <small>Ayuda con programación</small>
          </button>

          <button onclick="abrirHerramienta('planner')">
            📅
            <strong>NOVA Planner</strong>
            <small>Organizá proyectos</small>
          </button>

          <button onclick="abrirHerramienta('notas')">
            📝
            <strong>Notas</strong>
            <small>Guardá información</small>
          </button>

        </div>

      </div>

    </section>


    <footer class="zona-chat">

      <div class="modos">

        <button class="modo activo" onclick="cambiarModo('normal', this)">
          NOVA
        </button>

        <button class="modo" onclick="cambiarModo('tutor', this)">
          Tutor
        </button>

        <button class="modo" onclick="cambiarModo('code', this)">
          Code
        </button>

        <button class="modo" onclick="cambiarModo('ideas', this)">
          Ideas
        </button>

      </div>


      <div class="input-container">

        <textarea
          id="input"
          placeholder="Escribí un mensaje para NOVA..."
          rows="1"
          onkeydown="manejarEnter(event)"
        ></textarea>

        <button
          class="enviar"
          onclick="enviar()"
          id="botonEnviar"
        >
          ➤
        </button>

      </div>


      <div class="texto-ayuda">
        NOVA puede cometer errores. Verificá información importante.
      </div>

    </footer>

  </main>


  <div id="modal" class="modal oculto">

    <div class="modal-contenido">

      <button class="cerrar" onclick="cerrarModal()">
        ×
      </button>

      <div id="modalContenido"></div>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
